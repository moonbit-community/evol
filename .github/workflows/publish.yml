name: publish-package

on:
  workflow_dispatch:
    inputs:
      module:
        description: module to publish
        type: choice
        default: all
        options:
          - all
          - minifier
          - evol

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: publish
        run: |
          echo "$SECRET" > ~/.moon/credentials.json
          if [ "$MODULE" != "evol" ]; then
            (cd minifier && moon update && moon publish)
          fi
          if [ "$MODULE" != "minifier" ]; then
            (cd evol && moon update && moon publish)
          fi
          rm ~/.moon/credentials.json
        env:
          MODULE: ${{ inputs.module }}
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
